[project]
name = "hf-mcp-course"
version = "0.1.0"
description = "Hugging Face MCP Course - Weather Service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.12.0",
    "fastmcp>=2.10.0",
    "ipykernel>=6.29.5",
    "watchdog>=6.0.0",
    "huggingface-hub[mcp]>=0.32.0",
]

[project.scripts]
weather-server = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src"]
